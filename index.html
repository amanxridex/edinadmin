<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Infratech | Full CMS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ED INFRATECH</h2>
                <span class="badge">CMS</span>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="dashboard-tab">Dashboard</button>
                <button class="nav-btn" data-tab="analytics-tab" style="color: #60a5fa;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style="margin-right:8px;vertical-align:middle;"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                    Analytics
                </button>
                <button class="nav-btn" data-tab="leads-tab" style="color: #10b981;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style="margin-right:8px;vertical-align:middle;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Incoming Leads
                </button>
                
                <div class="nav-category">PAGES</div>
                <button class="nav-btn" data-tab="hero">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    Hero Content
                </button>
                <button class="nav-btn" data-tab="about">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    About Content
                </button>
                <div class="nav-section">COLLECTIONS</div>
                <button class="nav-btn" data-tab="projects">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    Projects
                </button>
                <button class="nav-btn" data-tab="agents">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Agents
                </button>
                <button class="nav-btn" data-tab="services">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    Services
                </button>
                <button class="nav-btn" data-tab="media">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    Media / News
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1>Supabase CMS Backend</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="window.open('https://edininfra.vercel.app', '_blank')">View Live Site</button>
                </div>
            </header>

            <div class="content-area">
                
                <!-- Dashboard Tab -->
                <section id="dashboard" class="tab-content active">
                    <div class="card-grid">
                        <div class="stat-card">
                            <h3>Total Projects</h3>
                            <div class="value" id="stat-projects">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>Total Agents</h3>
                            <div class="value" id="stat-agents">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>Media Posts</h3>
                            <div class="value" id="stat-media">-</div>
                        </div>
                        <div class="stat-card" style="border-top: 4px solid #10b981;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
                        
                        <!-- Contact Info Settings -->
                        <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem;">
                            <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Contact Information</h3>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="site-email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="site-phone" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Physical Address</label>
                                <input type="text" id="site-address" class="form-control">
                            </div>
                        </div>

                        <!-- Methodology Settings -->
                        <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem;">
                            <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Methodology Section</h3>
                            <div class="form-group">
                                <label>Main Heading</label>
                                <input type="text" id="meth-heading" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Subheading text</label>
                                <textarea id="meth-sub" class="form-control"></textarea>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                                <div>
                                    <label style="color:#aaa">Circle 1 Title</label>
                                    <input type="text" id="meth-c1-title" class="form-control" style="margin-bottom:0.5rem">
                                    <textarea id="meth-c1-desc" class="form-control" rows="3"></textarea>
                                </div>
                                <div>
                                    <label style="color:#aaa">Circle 2 Title</label>
                                    <input type="text" id="meth-c2-title" class="form-control" style="margin-bottom:0.5rem">
                                    <textarea id="meth-c2-desc" class="form-control" rows="3"></textarea>
                                </div>
                                <div>
                                    <label style="color:#aaa">Circle 3 Title</label>
                                    <input type="text" id="meth-c3-title" class="form-control" style="margin-bottom:0.5rem">
                                    <textarea id="meth-c3-desc" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Company Overview Settings -->
                        <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1.5rem;">
                            <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Company Overview (About Us)</h3>
                            <div class="form-group">
                                <label>Main Heading</label>
                                <input type="text" id="co-heading" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Subheading text</label>
                                <textarea id="co-sub" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Stats JSON</label>
                                <textarea id="co-stats" class="form-control" rows="4" style="font-family: monospace;"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Values JSON</label>
                                <textarea id="co-values" class="form-control" rows="6" style="font-family: monospace;"></textarea>
                            </div>
                        </div>

                    </div>
                </section>

                <!-- Testimonials Tab -->
                <section id="testimonials-tab" class="tab-content" style="display: none;">
                    <div class="header-flex">
                        <h2>Testimonials</h2>
                        <button class="btn btn-primary" onclick="openModal('testimonials')">Add Testimonial</button>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Subtitle</th>
                                    <th>Review text</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="testimonials-table-body">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="testimonials-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">Testimonial Details</h3>
            <form id="testimonials-form" onsubmit="handleFormSubmit(event, 'testimonials')">
                <input type="hidden" id="testimonials-id">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="testimonials-company" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Subtitle / Designation</label>
                    <input type="text" id="testimonials-subtitle" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Company Logo URL (Optional)</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="url" id="testimonials-logo" class="form-control" style="flex: 1;">
                        <input type="file" id="testimonials-logo-upload" accept="image/*" style="display: none;" onchange="uploadImage(event, 'testimonials-logo')">
                        <button type="button" class="btn" style="background: #374151; color: white;" onclick="document.getElementById('testimonials-logo-upload').click()">Upload Image</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Review text</label>
                    <textarea id="testimonials-review_text" class="form-control" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Box Color (Hex Code)</label>
                    <input type="color" id="testimonials-box_color" class="form-control" value="#ffee00" style="padding: 0; height: 40px;">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="closeModal('testimonials')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Testimonial</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action completed successfully</div>

    <script src="script.js"></script>
</body>
</html>
